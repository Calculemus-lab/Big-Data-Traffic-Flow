name: Repository rules

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repository-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Check branch and tracked files
        run: python3 scripts/check_repo_rules.py
