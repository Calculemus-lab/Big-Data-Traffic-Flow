name: Checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          enable-cache: true
      - run: uv sync --locked
      - name: Check Python types
        run: uv run --locked pyright
      - name: Check Python style
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check
      - run: uv run --locked python -m pytest -q
      - name: Exercise the teammate commands on synthetic data
        run: |
          uv run --locked bench fixture --output data/fixture
          uv run --locked bench prepare \
            --data data/fixture \
            --history-start-date 2030-11-03 \
            --history-end-date 2030-11-20 \
            --prediction-start-date 2030-11-20 \
            --prediction-end-date 2030-11-28 \
            --output data/ci \
            --panel D12_I5_N
          uv run --locked bench new ci_example
          uv run --locked bench experiment ci_example --task state --benchmark data/ci
          uv run --locked bench experiment baseline --task queue --benchmark data/ci
          uv run --locked bench experiment baseline --task odme --benchmark data/ci
          uv run --locked bench summary
      - name: Add experiment reports to the job summary
        if: always()
        run: |
          if [ -d runs ]; then
            find runs -name report.md -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            runs/
            !runs/**/predictions.csv
          if-no-files-found: ignore
          retention-days: 7
