[project]
name = "big-data-traffic-flow"
version = "0.0.0"
description = "Shared experimental environment for the IEEE Big Data Traffic Flow Bench."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false
required-version = "==0.12.5"

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pyright>=1.1.407",
]

[tool.pyright]
typeCheckingMode = "standard"
include = ["scripts", ""]
