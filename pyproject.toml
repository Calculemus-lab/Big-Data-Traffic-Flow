[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficbench-team"
version = "0.1.0"
description = "Shared experiments for TrafficFlowBench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "PyYAML==6.0.3",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pyright>=1.1.407",
    "pytest==9.1.1",
]

[project.scripts]
bench = "trafficbench.cli:main"

[tool.setuptools.packages.find]
include = ["trafficbench*", "solutions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.12.5"

[tool.pyright]
typeCheckingMode = "standard"
include = ["scripts", "trafficbench", "solutions"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
