[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficbench-team"
version = "0.1.0"
description = "Shared experiments for TrafficFlowBench"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=16", "scipy>=1.13", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bench = "trafficbench.cli:main"

[tool.setuptools.packages.find]
include = ["trafficbench*", "solutions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
