[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficbench-team"
version = "0.1.0"
description = "Shared experiments for TrafficFlowBench"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "pandas==3.0.6", "pyarrow==25.0.1", "scipy==1.18.1", "PyYAML==6.0.3"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
bench = "trafficbench.cli:main"

[tool.setuptools.packages.find]
include = ["trafficbench*", "solutions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
