[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficbench-team"
version = "0.1.0"
description = "Shared experiments for TrafficFlowBench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "PyYAML==6.0.3",
    "pydantic>=2.12,<3",
    "typer>=0.20,<1",
    "polars>=1.37,<2",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pyright>=1.1.407",
    "pytest==9.1.1",
    "scipy-stubs>=1.18,<1.19",
    "ruff>=0.16.10",
]

[project.scripts]
bench = "trafficbench.cli:main"

[tool.setuptools.packages.find]
include = ["trafficbench*", "solutions*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
include = [
    "trafficbench/**/*.py",
    "solutions/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
extend-select = ["ANN201", "ANN202", "ANN204"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
required-version = "==0.12.5"

[tool.pyright]
typeCheckingMode = "standard"
strict = ["trafficbench"]
include = ["scripts", "trafficbench", "solutions", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
reportMissingParameterType = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"
reportAssertAlwaysTrue = "error"
